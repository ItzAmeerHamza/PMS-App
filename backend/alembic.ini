# Alembic config for the local PharmaCare SQLite database.
# The database path is not set here: migrations/env.py asks src.core.paths,
# so development, tests, and installed builds all migrate the right file.
# Normal use: the API runs `upgrade head` on startup (src/core/migrate.py).
# By hand:    cd backend && .venv/bin/alembic upgrade head

[alembic]
script_location = %(here)s/migrations
path_separator = os
